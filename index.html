<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>与謝ぬ隊ポータルサイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #1F3B2C;
    --green-deep2: #17301F;
    --sage-bg: #E9EEE3;
    --cream: #F5F1E4;
    --border: #D9D2BB;
    --ink: #262620;
    --ink-soft: #6B6A5E;
    --tan: #E7D9B8;
    --tan-text: #6B5730;
    --red: #A13B2E;
    --red-deep: #822E23;
    --red-tint: #F4E3DE;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--sage-bg);
    color: var(--ink);
    font-family: "Noto Sans JP", sans-serif;
    line-height: 1.6;
    padding: 0 0 2rem;
  }

  header {
    background: var(--green-deep);
    color: #fff;
    padding: 0.9rem 1.1rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  header .seal {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border: 2px solid var(--red);
    border-radius: 8px;
    background: rgba(245,241,228,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--red);
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.1em;
    writing-mode: vertical-rl;
  }

  header .divider {
    width: 1px;
    height: 26px;
    background: rgba(255,255,255,0.25);
    flex-shrink: 0;
  }

  header h1 {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 18px;
    margin: 0;
    letter-spacing: 0.02em;
  }

  main {
    max-width: 600px;
    margin: 0 auto;
    padding: 1.3rem 1.1rem 0;
  }

  section {
    margin-bottom: 1.6rem;
    scroll-margin-top: 12px;
  }

  .sec-title {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 0.15rem;
    letter-spacing: 0.02em;
  }

  .sec-rule {
    height: 1px;
    background: var(--border);
    margin: 0.5rem 0 0.85rem;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  a.card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 0.75rem 0.6rem 0.75rem 0.9rem;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  a.card:hover {
    border-color: var(--green-deep);
  }

  a.card .title {
    font-family: "Shippori Mincho", serif;
    font-weight: 500;
    font-size: 13.5px;
    margin: 0;
  }

  a.card .go {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 0.3rem 0.55rem;
    border-radius: 999px;
    background: var(--tan);
    color: var(--tan-text);
  }

  footer {
    max-width: 600px;
    margin: 1.6rem auto 0;
    padding: 0.8rem 1.1rem 0;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="seal">与謝</div>
  <div class="divider"></div>
  <h1>与謝ぬ隊ポータルサイト</h1>
</header>

<main id="top">

  <section id="cat-1">
    <p class="sec-title">【内政・記録】</p>
    <div class="sec-rule"></div>
    <div class="cards">
      <a class="card" href="javascript:void(0)" data-url="https://kiz2103.github.io/rojo/" onclick="return unlockCard(event, this.dataset.url)">
        <p class="title">籠城台帳</p>
        <span class="go">→</span>
      </a>
      <a class="card" href="https://3594-editor.pages.dev/" target="_blank" rel="noopener">
        <p class="title">御触書エディタ</p>
        <span class="go">→</span>
      </a>
    </div>
  </section>

  <section id="cat-2">
    <p class="sec-title">【組織運営】</p>
    <div class="sec-rule"></div>
    <div class="cards">
      <a class="card" href="https://yosanu666.github.io/recruit/" target="_blank" rel="noopener">
        <p class="title">一門メンバー募集</p>
        <span class="go">→</span>
      </a>
      <a class="card" href="https://yosanu666.github.io/member-list/" target="_blank" rel="noopener">
        <p class="title">隊員名簿</p>
        <span class="go">→</span>
      </a>
    </div>
  </section>

  <section id="cat-3">
    <p class="sec-title">【攻略資料】</p>
    <div class="sec-rule"></div>
    <div class="cards">
      <a class="card" href="https://yosanu666.github.io/startdash/" target="_blank" rel="noopener">
        <p class="title">スタダガイド</p>
        <span class="go">→</span>
      </a>
      <a class="card" href="https://kenbo-no-palette.com/" target="_blank" rel="noopener">
        <p class="title">権謀のパレット</p>
        <span class="go">→</span>
      </a>
      <a class="card" href="https://yosanu666.github.io/tips/" target="_blank" rel="noopener">
        <p class="title">兵法帖</p>
        <span class="go">→</span>
      </a>
    </div>
  </section>

</main>

<div id="pw-modal" style="display:none; position:fixed; inset:0; background:rgba(23,48,31,0.55); align-items:center; justify-content:center; z-index:50; padding:1rem;">
  <div style="background:var(--cream); border:1px solid var(--border); padding:1.5rem; border-radius:12px; width:280px; max-width:100%; text-align:center;">
    <p style="font-weight:900; margin:0 0 0.5rem; font-size:15px;">幹部限定コンテンツ</p>
    <p style="font-size:12px; color:var(--ink-soft); margin:0 0 1rem;">パスワードを入力してください</p>
    <input type="password" id="pw-input" style="width:100%; padding:0.6rem; border:1px solid var(--border); border-radius:8px; font-size:14px; box-sizing:border-box; margin-bottom:0.5rem; background:#fff;">
    <p id="pw-error" style="font-size:12px; color:var(--red); margin:0 0 0.75rem; display:none;">パスワードが違います</p>
    <div style="display:flex; gap:8px; justify-content:center;">
      <button onclick="closePwModal()" style="padding:0.5rem 1rem; border:1px solid var(--border); background:transparent; border-radius:8px; cursor:pointer; font-size:13px; color:var(--ink); font-family:inherit;">キャンセル</button>
      <button onclick="submitPassword()" style="padding:0.5rem 1rem; border:1px solid var(--green-deep); background:var(--green-deep); color:#fff; border-radius:8px; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit;">開く</button>
    </div>
  </div>
</div>

<footer>与謝ぬ隊</footer>

<script>
  var pwPendingUrl = null;

  function unlockCard(e, url) {
    e.preventDefault();
    pwPendingUrl = url;
    document.getElementById("pw-error").style.display = "none";
    var input = document.getElementById("pw-input");
    input.value = "";
    document.getElementById("pw-modal").style.display = "flex";
    input.focus();
    return false;
  }

  function closePwModal() {
    document.getElementById("pw-modal").style.display = "none";
  }

  function submitPassword() {
    var pw = document.getElementById("pw-input").value;
    if (pw === "0229") {
      window.open(pwPendingUrl, "_blank", "noopener");
      closePwModal();
    } else {
      document.getElementById("pw-error").style.display = "block";
    }
  }

  document.getElementById("pw-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") submitPassword();
  });
</script>
</body>
</html>
